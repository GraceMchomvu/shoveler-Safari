# Trigger a Render deploy when main changes (requires one secret).
# Setup (once):
# 1. Render → shoveler-safari → Settings → Deploy Hook → copy URL
# 2. GitHub → repo Settings → Secrets → Actions → New secret
#    Name: RENDER_DEPLOY_HOOK_URL
#    Value: (paste the hook URL)
name: Deploy CMS API (Render)

on:
  push:
    branches: [main]
    paths:
      - "cms/**"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it once from Render → Settings → Deploy Hook."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy triggered."
