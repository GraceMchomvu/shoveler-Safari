# Free keep-alive for Render free tier (prevents 15-minute sleep / cold starts).
name: Keep CMS API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CMS health
        run: |
          set -e
          URL="${{ vars.CMS_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://shoveler-safari.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 90 "$URL" || true
