# Free hosting for the CMS API (Render free tier).
# Secrets (DATABASE_URL, JWT_SECRET, SMTP_*) must be set in the Render Dashboard — never commit them.

services:
  - type: web
    name: shoveler-safari
    runtime: node
    plan: free
    region: oregon
    rootDir: cms
    buildCommand: npm install && npm install --prefix server && npx prisma generate --schema=prisma/schema.prisma && node -e "const fs=require('fs');const s='server/node_modules';fs.mkdirSync(s+'/@prisma',{recursive:true});fs.mkdirSync(s+'/.prisma',{recursive:true});fs.cpSync('node_modules/@prisma/client',s+'/@prisma/client',{recursive:true});if(fs.existsSync('node_modules/.prisma'))fs.cpSync('node_modules/.prisma',s+'/.prisma',{recursive:true});"
    startCommand: node scripts/docker-boot.mjs
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_ORIGIN
        value: https://www.shovelersafari.com
      - key: SITE_ORIGIN
        value: https://www.shovelersafari.com
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_DEV_RESET_FILE
        value: "false"
      - key: SEED_ADMIN_PHONE
        value: "+255783591810"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
