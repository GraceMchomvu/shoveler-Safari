# Free hosting for the CMS API (Render free tier).
# Notes:
# - Sleeps after ~15 min idle → first login can take 30–60s (cold start)
# - DATABASE_URL must be Neon Postgres (also hard-fallback in docker-boot.mjs)
# - Keep-alive: .github/workflows/keep-cms-awake.yml pings /api/health every 10 minutes

services:
  - type: web
    name: shoveler-safari
    runtime: node
    plan: free
    region: oregon
    rootDir: cms
    buildCommand: npm install && npm install --prefix server && npx prisma generate --schema=prisma/schema.prisma && node -e "const fs=require('fs');const s='server/node_modules';fs.mkdirSync(s+'/@prisma',{recursive:true});fs.mkdirSync(s+'/.prisma',{recursive:true});fs.cpSync('node_modules/@prisma/client',s+'/@prisma/client',{recursive:true});if(fs.existsSync('node_modules/.prisma'))fs.cpSync('node_modules/.prisma',s+'/.prisma',{recursive:true});"
    startCommand: node scripts/docker-boot.mjs
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_B8MQlfP2vSwc@ep-cold-fog-ay7d1318-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        value: 16721ed6c057db74221bf93025f647bb655c037073c64724dc43edb998f747f98c465e977e05c302f99f422b69205f8f
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_ORIGIN
        value: https://www.shovelersafari.com
      - key: SITE_ORIGIN
        value: https://www.shovelersafari.com
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_DEV_RESET_FILE
        value: "false"
      - key: SEED_ADMIN_PHONE
        value: "+255783591810"
      - key: SEED_ADMIN_PASSWORD
        value: "SafariAdmin2026!"
      - key: SEED_ADMIN_EMAIL
        value: "victorkiungai@gmail.com"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
